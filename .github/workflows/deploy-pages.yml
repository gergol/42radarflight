name: Deploy to GitHub Pages

# Publishes the site by pushing the repo content to the gh-pages branch,
# which this repo's Pages site is served from. (The official
# actions/configure-pages enablement flow needs repo-admin rights the
# workflow token doesn't have.)

on:
  push:
    branches:
      - claude/flight-radar-web-app-9rir7x
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: ".github"
